<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sway — Øvelokalet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css?v=20261114r">
<style>
  .rehearsal { padding-top: 24px; padding-bottom: 64px; display: flex; flex-direction: column; gap: 20px; }
  .rehearsal h1 { font-size: clamp(48px, 8vw, 96px); font-weight: 800; letter-spacing: -0.03em; line-height: 0.9; color: var(--gold); }
  .rehearsal .lead { max-width: 640px; }
  .albums { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
  .album { border-radius: 14px; background: var(--ground-2); border: 1px solid var(--line); overflow: hidden; }
  .a-head { width: 100%; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 18px 22px; min-height: 56px; background: none; border: 0; color: var(--text); text-align: left; cursor: pointer; }
  .a-head::after { content: "+"; font-size: 24px; line-height: 1; color: var(--gold); margin-left: 8px; }
  .album.open .a-head::after { content: "–"; }
  .a-title { font-weight: 700; font-size: 20px; flex: 1; }
  .a-date { color: var(--muted); font-size: 15px; }
  .a-head:hover .a-title { color: var(--gold); }
  .album:not(.open) .a-player { height: 0; padding: 0; overflow: hidden; }
  .search { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .search input { width: 100%; min-height: 52px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--edge); background: var(--ground-2); color: var(--text); font-size: 18px; }
  .search input:focus { outline: none; border-color: var(--gold); }
  .s-status { margin: 0; min-height: 1.4em; color: var(--muted); font-size: 14px; }
  .results { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .results:empty { display: none; }
  .results li { border-bottom: 1px solid var(--line); }
  .results button { width: 100%; display: flex; align-items: center; gap: 16px; padding: 12px 4px; min-height: 52px; background: none; border: 0; color: var(--text); text-align: left; cursor: pointer; }
  .results button:hover b { color: var(--gold); }
  .r-play { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--gold); color: var(--ground); display: flex; align-items: center; justify-content: center; }
  .r-info { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.35; }
  .r-info span { color: var(--muted); font-size: 14px; }
  .r-len { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .a-player { padding: 0 12px 12px; }
  .a-player iframe { width: 100%; height: 400px; border: 0; border-radius: 10px; display: block; }
</style>
</head>
<body>

<header class="wrap header">
  <nav aria-label="Menu" class="nav">
    <a href="../">Til forsiden</a>
  </nav>
</header>

<main class="wrap rehearsal">
  <p class="label">Kun for dem med linket</p>
  <h1>Øvelokalet</h1>
  <p class="lead">Rå optagelser fra vores øvninger. Nye numre dukker op her, så snart vi har lagt dem op.</p>

  <div class="search" role="search">
    <label for="q" class="label">Find et nummer på tværs af alle album</label>
    <input id="q" type="search" placeholder="Fx Misty, wave, autum…" autocomplete="off" spellcheck="false">
    <p class="s-status" id="s-status" aria-live="polite"></p>
    <ol class="results" id="results"></ol>
  </div>

  <!--
    One .album per SoundCloud album, newest first.
    data-sc: for a public album, its share link (Share → Copy link).
             For a private album, the src link from its embed code (Share → Embed), which contains secret_token.
  -->
  <div class="albums">
    <div class="album" data-sc="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/soundcloud%3Aplaylists%3A2315002014%3Fsecret_token%3Ds-elptXDDxpAd">
      <button type="button" class="a-head" aria-expanded="false"><span class="a-title">Studio session</span><span class="a-date">september 2026</span></button>
      <div class="a-player"></div>
    </div>
    <div class="album" data-sc="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/soundcloud%253Aplaylists%253A2254788800">
      <button type="button" class="a-head" aria-expanded="false"><span class="a-title">7Vini – sidste øvning før koncerten 18. juni</span><span class="a-date">juni 2026</span></button>
      <div class="a-player"></div>
    </div>
  </div>
</main>

<footer class="wrap footer">
  <span>Sway CPH · swaycph.dk</span>
</footer>

<script src="search.js"></script>

</body>
</html>
