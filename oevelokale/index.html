<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sway — Øvelokalet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css?v=20261114r">
<style>
  .rehearsal { padding-top: 24px; padding-bottom: 64px; display: flex; flex-direction: column; gap: 20px; }
  .rehearsal h1 { font-size: clamp(48px, 8vw, 96px); font-weight: 800; letter-spacing: -0.03em; line-height: 0.9; color: var(--gold); }
  .rehearsal .lead { max-width: 640px; }
  .albums { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
  .album { border-radius: 14px; background: var(--ground-2); border: 1px solid var(--line); overflow: hidden; }
  .album summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 18px 22px; min-height: 56px; }
  .album summary::-webkit-details-marker { display: none; }
  .album summary::after { content: "+"; font-size: 24px; line-height: 1; color: var(--gold); margin-left: 8px; }
  .album[open] summary::after { content: "–"; }
  .a-title { font-weight: 700; font-size: 20px; flex: 1; }
  .a-date { color: var(--muted); font-size: 15px; }
  .album summary:hover .a-title { color: var(--gold); }
  .a-player { padding: 0 12px 12px; }
  .a-player iframe { width: 100%; height: 400px; border: 0; border-radius: 10px; display: block; }
</style>
</head>
<body>

<header class="wrap header">
  <nav aria-label="Menu" class="nav">
    <a href="../">Til forsiden</a>
  </nav>
</header>

<main class="wrap rehearsal">
  <p class="label">Kun for dem med linket</p>
  <h1>Øvelokalet</h1>
  <p class="lead">Rå optagelser fra vores øvninger. Nye numre dukker op her, så snart vi har lagt dem op.</p>

  <!--
    One <details> per SoundCloud album, newest first.
    data-sc: the album's share link from SoundCloud (Share → Copy link), without the ?si=… part.
  -->
  <div class="albums">
    <details class="album" data-sc="https://soundcloud.com/torbenblange/sets/sway-studio-session-sept-2026/s-elptXDDxpAd">
      <summary><span class="a-title">Studio session</span><span class="a-date">september 2026</span></summary>
      <div class="a-player"></div>
    </details>
    <details class="album" data-sc="https://soundcloud.com/torbenblange/sets/7vini-sidste-over-for-koncert">
      <summary><span class="a-title">7Vini – sidste øvning før koncerten</span><span class="a-date">juni 2026</span></summary>
      <div class="a-player"></div>
    </details>
  </div>
</main>

<footer class="wrap footer">
  <span>Sway CPH · swaycph.dk</span>
</footer>

<script>
  // Load each SoundCloud player only when its album is opened.
  document.querySelectorAll('.album').forEach(function (d) {
    d.addEventListener('toggle', function () {
      var slot = d.querySelector('.a-player');
      if (!d.open || slot.firstChild) return;
      var url = d.dataset.sc.split('?')[0];
      var src = 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(url) +
        '&color=%2393a9d3&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false&visual=false';
      var f = document.createElement('iframe');
      f.src = src;
      f.title = d.querySelector('.a-title').textContent;
      f.allow = 'autoplay';
      f.loading = 'lazy';
      slot.appendChild(f);
    });
  });
</script>

</body>
</html>
